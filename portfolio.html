<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portfolio y Finanzas</title>
    <!-- Firebase SDKs (Compatibilidad v8/v9) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1, h2 { color: #1e293b; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; font-weight: 600; color: #64748b; }
        .btn-borrar { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; transition: all 0.2s; }
        .btn-borrar:hover { background: #d32f2f; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h1>Portfolio y Control de Finanzas</h1>
    
    <!-- Resumen de KPIs / Totales -->
    <div id="kpis">
        <p>Total Portfolio: <strong id="kpiTotal">0 €</strong></p>
        <p>Total Invertido: <strong id="kpiInvertido">0 €</strong></p>
        <p>Rentabilidad: <strong id="kpiRentab">0%</strong> (<span id="kpiRentabEur">0 €</span>)</p>
        <p>Liquidez: <strong id="kpiLiquidez">0 €</strong></p>
    </div>

    <h2>Historial de Aportaciones e Ingresos</h2>
    <table>
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Concepto / Activo</th>
                <th style="text-align: right;">Importe</th>
                <th style="text-align: center;">Acciones</th>
            </tr>
        </thead>
        <tbody id="lista-aportaciones">
            <!-- Las filas se renderizan dinámicamente -->
        </tbody>
    </table>
</div>

<script>
    // LISTA DE ACTIVOS
    const ACTIVOS = [
        { id: 'sp500', nombre: 'Fidelity S&P 500 Index Fund P Acc', ticker: 'IE00BYX5NX33', emoji: '🇺🇸', categoria: 'rv' },
        { id: 'europa', nombre: 'Vanguard European Stock Index EUR Acc', ticker: 'IE00B945VV12', emoji: '🇪🇺', categoria: 'rv' },
        { id: 'india', nombre: 'Franklin India Fund Class A Acc', ticker: 'LU0231205187', emoji: '🇮🇳', categoria: 'rv' },
        { id: 'china', nombre: 'Franklin FTSE China Index Fund Acc', ticker: 'IE00BHZRR150', emoji: '🇨🇳', categoria: 'rv' },
        { id: 'oro', nombre: 'iShares Physical Gold ETC', ticker: 'IE00B4ND3602', emoji: '🥇', categoria: 'oro' },
        { id: 'liquidez_mi', nombre: 'Efectivo Remunerado / Groupama Trésorerie IC', ticker: 'Monetario', emoji: '💧', categoria: 'liquidez' },
        { id: 'liquidez_tr', nombre: 'Efectivo Remunerado Trade Republic', ticker: '2.5% TAE', emoji: '💧', categoria: 'liquidez' }
    ];

    const DCA_MESES = ['Nov 2026', 'Dic 2026', 'Ene 2027', 'Feb 2027', 'Mar 2027', 'Abr 2027', 'May 2027', 'Jun 2027', 'Jul 2027', 'Ago 2027'];
    const DCA_OBJETIVO = 20000;
    const DCA_MENS_IMPORTE = 2000;

    let misAportaciones = [];

    function getData() { 
        try { return JSON.parse(localStorage.getItem('portfolio_data')) || {}; } 
        catch(e) { return {}; } 
    }

    function fmtK(val) {
        return (val || 0).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
    }

    // CÁLCULO DE KPIS Y TOTALES
    function calcularTotales() {
        let totalValor = 0;
        let totalAportado = 0;
        let totalLiquidez = 0;

        misAportaciones.forEach(item => {
            const monto = parseFloat(item.monto || item.importe || 0);
            totalAportado += monto;
            totalValor += monto;
            if (item.categoria === 'liquidez' || item.esLiquidez) {
                totalLiquidez += monto;
            }
        });

        const ganancia = totalValor - totalAportado;
        const rentabPct = totalAportado > 0 ? (ganancia / totalAportado) * 100 : 0;

        const kpiTotal = document.getElementById('kpiTotal');
        const kpiInvertido = document.getElementById('kpiInvertido');
        const kpiRentab = document.getElementById('kpiRentab');
        const kpiRentabEur = document.getElementById('kpiRentabEur');
        const kpiLiquidez = document.getElementById('kpiLiquidez');

        if (kpiTotal) kpiTotal.textContent = fmtK(totalValor);
        if (kpiInvertido) kpiInvertido.textContent = fmtK(totalAportado);
        if (kpiRentab) {
            kpiRentab.textContent = (rentabPct >= 0 ? '+' : '') + rentabPct.toFixed(2) + '%';
            kpiRentab.style.color = rentabPct >= 0 ? '#2e7d32' : '#c62828';
        }
        if (kpiRentabEur) kpiRentabEur.textContent = (ganancia >= 0 ? '+' : '') + fmtK(ganancia);
        if (kpiLiquidez) kpiLiquidez.textContent = fmtK(totalLiquidez);
    }

    // DIBUJAR TABLA CON BOTÓN DE BORRADO
    function renderTabla() {
        const contenedor = document.getElementById('lista-aportaciones') || document.getElementById('tabla-aportaciones') || document.getElementById('historial');
        if (!contenedor) return;

        contenedor.innerHTML = '';

        if (!misAportaciones || misAportaciones.length === 0) {
            contenedor.innerHTML = `
                <tr>
                    <td colspan="4" style="text-align: center; color: #888; padding: 15px;">
                        No hay aportaciones ni ingresos registrados.
                    </td>
                </tr>`;
            return;
        }

        misAportaciones.forEach(item => {
            const fila = document.createElement('tr');
            const fechaFormateada = item.fecha ? new Date(item.fecha).toLocaleDateString('es-ES') : '-';
            const importeFormateado = fmtK(item.monto || item.importe || 0);

            fila.innerHTML = `
                <td>${fechaFormateada}</td>
                <td><strong>${item.concepto || item.activo || 'Aportación'}</strong></td>
                <td style="text-align: right; font-weight: bold;">${importeFormateado}</td>
                <td style="text-align: center;">
                    <button class="btn-borrar" onclick="borrarAportacion('${item.id}')" title="Eliminar registro">
                        🗑️ Borrar
                    </button>
                </td>
            `;

            contenedor.appendChild(fila);
        });
    }

    // ELIMINACIÓN DE APORTACIÓN EN FIRESTORE
    async function borrarAportacion(idAportacion) {
        if (!idAportacion) return;

        const confirmar = confirm("¿Estás seguro de que deseas eliminar este ingreso/aportación?");
        if (!confirmar) return;

        try {
            // Intentar borrar en Firestore si Firebase está inicializado
            if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
                await firebase.firestore().collection('aportaciones').doc(idAportacion).delete();
            }

            // Actualizar lista en memoria
            misAportaciones = misAportaciones.filter(item => item.id !== idAportacion);

            // Guardar también copia local si se usa localStorage
            localStorage.setItem('aportaciones_backup', JSON.stringify(misAportaciones));

            // Actualizar interfaz y totales
            renderTabla();
            calcularTotales();

            console.log(`[OK] Aportación ${idAportacion} eliminada correctamente.`);
        } catch (error) {
            console.error("Error al borrar el registro:", error);
            alert("Ocurrió un error al intentar borrar el registro en Firestore.");
        }
    }

    // INICIALIZACIÓN / CARGA DE DATOS DESDE FIRESTORE
    async function cargarDatosFirestore() {
        if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
            try {
                const snapshot = await firebase.firestore().collection('aportaciones').get();
                misAportaciones = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
            } catch(e) {
                console.warn("Cargando desde almacenamiento local por fallback:", e);
                misAportaciones = JSON.parse(localStorage.getItem('aportaciones_backup')) || [];
            }
        }
        renderTabla();
        calcularTotales();
    }

    window.addEventListener('DOMContentLoaded', () => {
        cargarDatosFirestore();
    });
</script>

</body>
</html>
